# Unitree Go2 Configuration
robot_type: "go2"

# --- Control & Gains ---
control:
  kp: 25.0                # Reverted from 80.0; high Kp over async IPC causes violent oscillations
  kd: 0.5                 # Reverted from 2.0 to match training physics
  decimation: 20          # Run policy at 50Hz (1000Hz PD / 20)
  action_scale: 0.25
  saturation_limit: 0.90  # 90% of physical capacity
  default_height: 0.33    # Target height for standing pose (m)

# --- Motor Physical Parameters ---
motor:
  max_torque: 45.0        # Nm (Saturation torque for Go2)
  max_velocity: 30.0      # rad/s (Limit at zero torque)

# --- State Estimation ---
state_estimator:
  use_estimator: false    # Switch between perfect and estimated odom
  dt: 0.02                # Control loop dt (50Hz)
  # Contact gate, in raw FSR counts ABOVE each foot's own no-load reading - not
  # an absolute value. The four sensors sit at visibly different zeros, so one
  # absolute cut is a different gate on every foot: the highest-offset foot trips
  # early, the lowest may never trip. 10 counts is ~27 N (see fsr_scale), against
  # ~37 N per foot in an even stance.
  contact_threshold: 10.0

  # FSR zeroing on the real robot (deploy). At startup real_driver averages
  # fsr_calibration_time of readings per foot and uses those as the zeros, so the
  # threshold above means the same thing on all four. Keep the feet UNLOADED for
  # that window - a loaded foot would zero out its own load and then never
  # register contact. Guards against exactly that: a measured zero above
  # fsr_offset_max (a foot carrying weight reads ~bias+14) or noisier than
  # fsr_spread_max (a foot being moved) is rejected, and fsr_bias is kept for
  # that foot. The driver logs every measured zero, so tune these from the log.
  fsr_calibration_time: 1.0   # Seconds of samples at startup; 0 disables
  fsr_offset_max: 25.0        # Reject a zero above this (foot was loaded)
  fsr_spread_max: 3.0         # Reject a zero noisier than this (foot was moving)

  # Simulated FSR (MuJoCo only). MuJoCo's touch sensor gives clean newtons, which
  # hides the offset problem entirely. These map newtons back onto the robot's raw
  # scale (raw = bias + N / scale, plus noise) so the SAME contact_threshold above
  # is what the simulator applies. The simulated sensor is built from fsr_bias, so
  # in sim that value IS the calibration the robot has to measure.
  #   scale: with a 15.2 kg Go2, an even stance is 149/4 = 37 N per foot, which
  #   the robot reads as 30 raw -> 37 / (30 - 16) = 2.66 N per raw unit.
  fsr_bias: 16.0          # Raw reading with the foot unloaded
  fsr_scale: 2.66         # Newtons per raw FSR unit
  fsr_noise: 0.7          # Gaussian sigma in raw units (real spread is ~15-17)

  # Linear Kalman Filter (LKF) — 6-state: body velocity + accelerometer bias
  # Increase q_vel  → trust IMU more  (faster response, more noise)
  # Increase r_meas → trust FK less   (smoother, but slower correction)
  kalman:
    process_noise_vel:  0.01   # Q diagonal — velocity states  (m/s)²/step
    process_noise_bias: 0.001  # Q diagonal — accel bias states (m/s²)²/step
    measurement_noise:  0.05   # R diagonal — leg odometry measurement (m/s)²

# --- Terrain (MuJoCo driver) ---
terrain:
  amplitude: 0.08
  extent: 6.0
  resolution: 400
  smoothing: 1
  seed: 69
  foot_friction_slide: 1.1
  foot_friction_torsion: 0.05

# --- Simulated robot modifications (MuJoCo driver) ---
robot_mods:
  foot_mass: 0.01

# --- Safety Limits (Radians) ---
# Official Unitree Go2 Hardware Limits
joint_limits:
  abduction:
    min: -1.047
    max: 1.047
  hip_front:
    min: -1.571
    max: 3.491
  hip_rear:
    min: -0.524
    max: 4.538
  knee:
    min: -2.723
    max: -0.5    # Official is -0.838, set to -0.5 to allow straighter stance if desired

# --- Networking ---
network:
  robot_ip: "192.168.123.18"
  local_ip: "192.168.123.10"
  interface: "eth0"
  ros_domain_id: 42

  # ROS 2 discovery. The robot's WiFi AP drops multicast, so DDS discovery never
  # completes over wireless (ping is fine, `ros2 topic list` is empty). A FastDDS
  # discovery server on the robot replaces multicast with unicast client/server.
  # 10.42.0.1 is the AP's own address, fixed by NetworkManager shared mode, so it
  # is the same for every laptop that joins — nothing per-machine to edit.
  # Start it on the robot with:  fast-discovery-server -i 0 -l 10.42.0.1 -p 11811
  discovery_server: "10.42.0.1:11811"
  discovery_mode: "auto"     # auto = on only when this machine is on the AP's subnet
                             # on   = always use it | off = always plain multicast

# --- Safety ---
safety:
  watchdog_timeout: 0.35     # Seconds before the policy is cut if no heartbeat
  emergency_kd: 5.0          # Damping applied on emergency stop (kp=0). Zero would
                             # leave the joints free and the robot would collapse;
                             # this makes it sink under control instead.
  supervisor_frequency: 10.0 # Hz (Rate at which safety checks are performed)
  global_max_torque_percent: 55.0 # Maximum allowed torque as a percentage of physical motor capacity (45.0 Nm)
  base_tilt_limit_deg: 30   # Trigger emergency stop if base tilts past 30 degrees in any direction
  base_forward_tilt_limit_deg: 30.0    # Trigger emergency stop if pitched forward past 30 degrees
  joint_rom_safety_margin: 0.15        # Protect the outer 15% range of motion of each joint
  safety_policy_path: ""               # Relative path to backup safety policy (.pt). Empty = disable on violation.

# --- Pose Generator ---
poses:
  default_interp_duration: 3.0   # Seconds to interpolate between poses
  stand:    [0.1, -0.1, 0.1, -0.1, 0.8, 0.8, 1.0, 1.0, -1.5, -1.5, -1.5, -1.5]
  lie_flat: [0.1, -0.1, 0.5, -0.5, 1.25, 1.25, 1.25, 1.25, -2.6, -2.6, -2.6, -2.6]
  sit:      [0.1, -0.1, 0.1, -0.1, 1.2, 1.2, 2.0, 2.0, -2.0, -2.0, -2.5, -2.5]

# --- MCAP Logging & Telemetry Recording ---
logging:
  auto_record: true            # Automatically start background recording when launching simulation drivers
  record_dir: "Mcap/Recordings"      # Destination directory for recorded MCAP logs
  cluster_window_ms: 5              # Time window in ms to cluster messages into a single physical playback frame
