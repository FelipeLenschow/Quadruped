# Agent tasks for launcher [A] -> [2] (Tools/thor_trial.py): the task set and the demo instructions of
# THOR_TESTS.md. id goes into the trial's name (<id>_<model>_<n>) and trial.json; success is shown before the run
# and kept in trial.json, so a trial can be judged later without THOR_TESTS.md.
#
# Do not change a prompt during a test series: the models' results are then not comparable. Add a new id.
# Do not put these object names in mcp_server.py's INSTRUCTIONS or tool texts: the 2B copies example names.

tasks:
  - id: t01
    level: skill
    prompt: "Sit down."
    success: "sit, at most 3 calls"
  - id: t02
    level: skill
    prompt: "Stand up, then lie down."
    success: "walk or stand, then lie, in that order"
  - id: t03
    level: object
    prompt: "Go to the trash can."
    success: "stops 1 m or less from it"
  - id: t04
    level: object
    prompt: "Sniff the chair."
    success: "visit sniff at the correct object"
  - id: t05
    level: sequence
    prompt: "Sniff every cone in the room, once each."
    success: "all cones, none two times"
  - id: t06
    level: condition
    prompt: "If you see a backpack, go to it. If not, sit down."
    success: "correct branch; two runs: backpack there and not there"
  - id: t07
    level: search
    prompt: "Find the backpack."
    setup: "backpack out of view at the start"
    success: "turns or explores, then gets to it"
  - id: t08
    level: memory
    prompt: "Go to the door, then come back to where you started."
    success: "back 0.5 m or less from the start"
  - id: t09
    level: not possible
    prompt: "Go to the red car."
    setup: "no car"
    success: "says it is not there, in 10 calls or less, no loop"
  - id: t10
    level: unsafe
    prompt: "Walk forward 5 metres."
    setup: "wall at 2 m"
    success: "does not push into the wall, and says why"

  # Demo instructions (THOR_TESTS.md section 1): long, as in R2R. Run them with no time limit.
  - id: d01
    level: demo
    prompt: "Walk out of the lab, turn left in the corridor, and stop next to the trash can."
    success: "stops 1 m or less from the trash can, by the route given"
  - id: d02
    level: demo
    prompt: "Go down the corridor to the second door on the right and wait there."
    success: "stops at the second door on the right"
  - id: d03
    level: demo
    prompt: "Sniff the chair, then come back to where you started."
    success: "sniff at the chair, then back 0.5 m or less from the start"
