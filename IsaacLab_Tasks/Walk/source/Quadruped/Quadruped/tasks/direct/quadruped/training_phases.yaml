default: &default
  env:
    obs_history_len: 0
    robot_cfg: GO2
    # "position" -> action is a residual on the nominal stance, tracked by the actuator PD
    #               at 200 Hz while the policy runs at 50 Hz (decimation 4).
    # "torque"   -> action IS joint effort, no PD loop, policy runs at 200 Hz (decimation 1)
    #               and the actuator's PD gains are zeroed. Go2/A1 only -- Go1's
    #               ActuatorNetMLP cannot be driven by a commanded effort.
    # Cannot change mid-curriculum: it fixes decimation and the actuator gains at startup.
    control_mode: position
    # Torque mode only. N·m per unit of policy output, before the actuator's torque-speed
    # clamp. Scale to the actuator envelope, not to action_scale. Isaac Lab's DCMotorCfg
    # gives Go2 effort_limit 23.5 N·m and A1 33.5 N·m; Chen et al. use 10.0 on A1, so the
    # equivalent for Go2 is 10 * 23.5/33.5 ~= 7. At 7.0 a 3-sigma action reaches ~21 N·m,
    # just inside the limit, which is the balance that scale is meant to strike.
    torque_scale: 7.0
    # Per-step reward is normalised to this control period so per-second reward does not
    # change with the control rate -- without it a 200 Hz run banks 4x the return per second
    # and torque-vs-position is not a matched comparison. 0.02 = the 50 Hz position period,
    # so position runs scale by exactly 1.0. Set 0.0 to disable.
    reward_dt_ref: 0.02
    # Torque mode only. Restoring stiffness (N·m per rad) for the soft joint-limit barrier
    # that stands in for position mode's target clamp.
    joint_limit_barrier_stiffness: 25.0
    # Re-inflate the policy std and restore the base learning rate when the curriculum
    # ENTERS this phase. Off by default and only used by phase1_torque -- see the comment
    # there. Position phases never set it, so their baselines are unaffected.
    reset_exploration_on_entry: false
    # Value to re-inflate the log std to. -0.7 -> std 0.5, against the 0.0 (std 1.0) a
    # from-scratch run starts at.
    reset_exploration_log_std: -0.7
    # Base height on reset. Omit to get the mode default: 0.50 for position (the PD holds the
    # stance through the drop) or 0.35 for torque (limp legs cannot survive a 0.2 m drop, so
    # the robot is spawned already standing). Lower it further if it still lands hard.
    # spawn_height: 0.35
    terrain: flat
    num_envs: 2000
    action_scale: 0.25
    observation_noise_scale: 0.0
    max_timesteps: 50000
    episode_length_s: 20.0
    base_angle_termination_thresh: 0.7
  domain_randomization:
    joint_friction_range: [0.0, 0.0]
    joint_stiffness_range: [0.0, 0.0]
    joint_pd_damping_range: [0.0, 0.0]
    action_latency_range_steps: [0, 0]
    motor_backlash_range: [0.0, 0.0]
    payload_mass_range: [0.0, 0.0]
    com_displacement_range: [0.0, 0.0]
  events:
    enable_pushes: false
    push_velocity_range: [0.0, 0.0]
  rewards:
    # ── Everything off ──
    rew_scale_alive: 0.0
    rew_scale_track_lin_vel_xy_exp: 0.0
    rew_scale_track_ang_vel_z_exp: 0.0

    rew_scale_feet_air_time: 0.0
    # Feet in contact beyond feet_grounded_allowed, charged every step while a move command is
    # active. NEGATIVE. The only gait term that is nonzero while standing on all four -- every
    # other one is gated on a foot already being airborne, so they read zero, with zero gradient,
    # for exactly the robot they are meant to get moving. allowed=2 means a trot pays nothing, so
    # it stops applying pressure once a gait exists. Standing pays (4-2)=2 units, so the scale is
    # the per-step cost of standing divided by 2 -- compare it against rew_scale_alive.
    rew_scale_feet_grounded: 0.0
    feet_grounded_allowed: 2.0
    # Foot height, both scored by exp(-(h-target)^2/foot_height_sigma), different accounting:
    #   _reward  POSITIVE, DENSE -- per airborne foot per STEP, on instantaneous height. The lift
    #            incentive. Size it against rew_scale_alive: 0.4 with two feet up is ~0.8/step.
    #   _penalty NEGATIVE, once per landing, on that swing's APEX. Kills the high-stepping the
    #            dense reward encourages. Use one or the other per phase.
    rew_scale_foot_height_penalty: 0.0
    rew_scale_foot_height_reward: 0.0
    rew_scale_foot_landing_vel: 0.0

    rew_scale_flat_orientation_l2: 0.0
    rew_scale_lin_vel_z_l2: 0.0
    rew_scale_ang_vel_xy_l2: 0.0
    rew_scale_base_acc_l2: 0.0

    rew_scale_dof_pos_l2_walk: 0.0
    rew_scale_dof_pos_l2_stance: 0.0

    rew_scale_dof_torques_l2: 0.0
    rew_scale_dof_acc_l2: 0.0
    rew_scale_action_rate_l2: 0.0

    rew_scale_feet_air_penalty: 0.0
    rew_scale_feet_air_penalty_static: 0.0
    rew_scale_joint_vel_l2_static: 0.0

    rew_scale_pos_deviation_l1: 0.0
    rew_scale_yaw_deviation_l1: 0.0
    rew_scale_undesired_contacts: 0.0
    rew_scale_base_height_l2: 0.0

    rew_scale_grf_balance: 0.0
    rew_scale_grf_target: 0.0
    rew_scale_max_contact_force: 0.0

    rew_scale_gait_phase_sym: 0.0

    # ── Paper reward set: Dowdy & Chagas Vaz, IEEE/SICE SII 2026, Table III ──
    # Separate from every scale above: these use L1 norms where the repo squares, so the paper's
    # weights only mean what the paper meant when applied to the paper's expressions. A phase
    # using this set must zero the repo equivalents -- see phase_paper_torque.
    rew_scale_paper_alive: 0.0
    rew_scale_paper_feet_air_time: 0.0
    rew_scale_paper_track_lin_vel: 0.0
    rew_scale_paper_track_ang_vel: 0.0
    rew_scale_paper_gait: 0.0
    rew_scale_paper_action_smooth: 0.0
    rew_scale_paper_air_time_var: 0.0
    rew_scale_paper_base_motion: 0.0
    rew_scale_paper_base_orientation: 0.0
    rew_scale_paper_foot_slip: 0.0
    rew_scale_paper_dof_pos: 0.0
    rew_scale_paper_dof_torque: 0.0
    rew_scale_paper_dof_acc: 0.0
    rew_scale_paper_dof_vel: 0.0
    rew_scale_paper_thigh_contact: 0.0
    rew_scale_paper_calf_contact: 0.0
    paper_air_time_offset: 0.3
    paper_vel_tracking_sigma: 0.25
    paper_ang_tracking_sigma: 0.25
    # NOT from the paper -- Table III leaves l_sync/l_async undefined. Width of the Gaussian in
    # the reconstruction (s^2); 0.01 puts the knee at ~0.1 s of phase error between two feet.
    paper_gait_sigma: 0.01
    paper_gait_min_swing: 0.15

    # ── Shape parameters (NOT weights -- kept non-zero, see header note) ──
    target_feet_air_time: 0.5
    feet_air_time_sigma: 0.02
    target_feet_air_time_slow: 0.5
    feet_air_time_speed_lo: 0.1
    feet_air_time_speed_hi: 0.35
    target_foot_height: 0.10
    foot_height_sigma: 0.01
    # Divisor, so it must stay non-zero even here (see header note). 0.6 puts the knee of
    # 1 - exp(-vz^2/sigma) at ~0.8 m/s: 0.3 m/s -> 0.14, 0.8 -> 0.66, 1.5+ -> saturated.
    foot_landing_vel_sigma: 0.6
    target_base_height: 0.25
    max_contact_force_pct: 1.0

    gait_phase_offset_front: 0.5
    gait_phase_offset_rear:  0.5
    gait_phase_offset_left:  0.5
    gait_phase_offset_right: 0.5
    gait_phase_offset_diag1: 0.0
    gait_phase_offset_diag2: 0.0
  commands:
    command_lin_vel_std: 0.5
    command_ang_vel_std: 0.5
    vel_tracking_sigma_exp: 0.0
    command_x_range: [-1.0, 1.0]
    command_y_range: [-1.0, 1.0]
    command_yaw_range: [-1.0, 1.0]
    command_resampling_time: 10.0
    static_velocity_threshold: 0.1
    static_command_ramp: 0.1
    max_pos_leash: 0.4
    max_yaw_leash: 0.5
    zero_command_fraction: 0.0
    standby_duration_s: 0.0
    x_only_command_fraction: 0.0
    y_only_command_fraction: 0.0
    yaw_only_command_fraction: 0.0

phases:
  phase1:
    inherits: default
    env:
      obs_history_len: 0
      terrain: rough
      num_envs: 2000
      action_scale: 0.25
      observation_noise_scale: 0.05
      max_timesteps: 300000
      episode_length_s: 20.0
      base_angle_termination_thresh: 0.7
    domain_randomization:
      joint_friction_range: [0.03, 0.3]
    events:
      enable_pushes: true
      push_velocity_range: [-0.4, 0.4]
    rewards:
      rew_scale_alive: 1.0
      rew_scale_track_lin_vel_xy_exp: 1.5
      rew_scale_track_ang_vel_z_exp: 0.75

      rew_scale_lin_vel_z_l2: -2.0
      rew_scale_ang_vel_xy_l2: -0.05
      rew_scale_flat_orientation_l2: -5.0

      rew_scale_dof_torques_l2: -0.0002
      rew_scale_dof_acc_l2: -3.0e-7
      rew_scale_action_rate_l2: -0.01

      rew_scale_foot_height_reward: 0.4
      target_foot_height: 0.08
      foot_height_sigma: 0.005

    commands:
      command_lin_vel_std: 0.5
      command_ang_vel_std: 0.5
      vel_tracking_sigma_exp: 0.0
      command_x_range: [-1.0, 1.0]
      command_y_range: [-1.0, 1.0]
      command_yaw_range: [-1.0, 1.0]
      command_resampling_time: 6.0
      static_velocity_threshold: 0.02
      static_command_ramp: 0.1
      zero_command_fraction: 0.05

  phase2:
    inherits: phase1
    env:
      max_timesteps: 300000
    rewards:
      rew_scale_foot_height_reward: 0.0
      rew_scale_foot_height_penalty: -0.4
      target_foot_height: 0.08
      foot_height_sigma: 0.005

      rew_scale_foot_landing_vel: -0.3
      foot_landing_vel_sigma: 0.6

      rew_scale_dof_pos_l2_stance: -0.5

      rew_scale_gait_phase_sym: -0.15

      # rew_scale_pos_deviation_l1: -0.1
      # rew_scale_yaw_deviation_l1: -0.1

  # ══════════════════════════════════════════════════════════════════════════
  # Torque-control counterpart to the phase1 -> phase2 curriculum.
  #
  # Everything except the control mode is deliberately IDENTICAL to the position phases --
  # same reward scales, same DR, same commands, same terrain, same curriculum shape. That is
  # the point: the one published hardware comparison (Chen et al., Humanoids 2023) had to
  # modify the reward function between its two arms and says so, so a matched run is exactly
  # the gap worth filling.
  #
  # What differs is forced by the mode, not chosen:
  #   - decimation 1 (200 Hz) instead of 4 (50 Hz)
  #   - actuator PD gains zeroed; the action becomes joint effort
  #   - per-step reward scaled by 0.25 via reward_dt_ref, so per-SECOND reward still matches
  #
  # max_timesteps is 4x the position phases so that both curricula see the same amount of
  # simulated experience: 1.2M agent steps at decimation 1 is 1.2M physics steps, the same
  # physics work as 300k agent steps at decimation 4. Wall clock is a bit longer than the
  # ~12 h position run because there are 4x as many policy forward passes, not because the
  # physics got more expensive.
  #
  # Joint limits are still enforced: _joint_limit_barrier in quadruped_env.py replaces the
  # position-target clamp with a one-sided restoring torque, so the reward set stays exactly
  # matched to the position phases instead of having to carry limit safety. Stiffness is
  # env.joint_limit_barrier_stiffness (default 25.0, the position mode's Kp).
  #
  # Expect the learning curve to sit BELOW the position run for a long time before crossing
  # -- Chen et al. see torque trailing every position baseline until ~600 iterations. Judging
  # this early against phase2 will give the wrong answer.
  #
  # Go2 or A1 only: Go1's ActuatorNetMLP cannot be driven by a commanded effort, and RANDOM
  # mixes it in. Run as: QUADRUPED_TRAINING_PHASE=phase1_torque_to_phase2_torque
  # ══════════════════════════════════════════════════════════════════════════
  phase0_torque:
    inherits: default
    env:
      control_mode: torque
      torque_scale: 7.0
      # terrain: rough
      num_envs: 2000
      action_scale: 0.25
      observation_noise_scale: 0.05
      max_timesteps: 10000
      episode_length_s: 10.0
      base_angle_termination_thresh: 0.7
    events:
      enable_pushes: false
    rewards:
      # Raised from the 1.0 used elsewhere, and it is load-bearing. Velocity tracking is
      # deliberately OFF here (see below), and it was the only other positive reward -- with
      # alive at 1.0, every state is negative until the policy can actually stand, so
      # terminating (which stops accumulation at 0) beats living and the agent learns to end
      # episodes fast. That is the exact failure this phase exists to avoid. 3.0 keeps a
      # standing robot clearly positive: +3.00 standing, -1.70 collapsed.
      rew_scale_alive: 3.0

      # NO velocity tracking in this phase. With commands pinned to zero it scores "hold
      # still", which sounds right and is not: a FALLEN robot is perfectly still, so the two
      # tracking terms were handing +2.25/step to a collapsed heap -- 69% of the +3.25 a
      # perfect stand scored. And it is not a harmless constant: a robot struggling to push
      # up has nonzero v_xy and LOSES tracking reward, so the term actively rewarded giving
      # up. Tracking starts in phase1_torque, where a nonzero command makes it mean something.
      #
      # Cost: nothing penalises horizontal drift here, so the policy may stand and slide a
      # little. Acceptable for a bootstrap; phase1_torque fixes it immediately.

      rew_scale_flat_orientation_l2: -5.0
      rew_scale_lin_vel_z_l2: -2.0
      rew_scale_ang_vel_xy_l2: -0.05

      # -100, not -1. This is an L2 on a quantity whose entire realistic range is 0.15-0.30 m,
      # so (z - 0.25)^2 tops out near 0.01: at -1.0 a full collapse cost -0.01 and the term
      # did nothing whatsoever. -100 makes a 9 cm shortfall cost -0.81 -- the same order as
      # the other terms instead of three magnitudes below them.
      rew_scale_base_height_l2: -100.0
      target_base_height: 0.25
      # Holding the stance IS the task here, so 4x the -0.5 phase2 uses. Summed over 12
      # joints: 0.15 rad/joint -> -0.54, 0.40 rad/joint -> -3.84.
      rew_scale_dof_pos_l2_stance: -2.0

      rew_scale_dof_torques_l2: -0.0002
      rew_scale_dof_acc_l2: -3.0e-7
      rew_scale_action_rate_l2: -0.01
      # Feet left unpenalised: stepping to recover balance is allowed.
    commands:
      command_x_range: [0.0, 0.0]
      command_y_range: [0.0, 0.0]
      command_yaw_range: [0.0, 0.0]
      zero_command_fraction: 1.0
      command_resampling_time: 10.0
      static_velocity_threshold: 0.02
      static_command_ramp: 0.1

  phase1_torque:
    inherits: default
    env:
      control_mode: torque
      torque_scale: 7.0
      # phase0_torque hands over a policy that stands, and a search distribution that has
      # been annealed to nothing doing it: the 2026-08-25_23-35-28 run entered this phase at
      # std 0.037 (0.24 N*m of noise against a 23.5 N*m envelope) with the lr floored at
      # 1.3e-5 by KLAdaptiveLR, and never moved off standing -- tracking reward went DOWN
      # from 1.14 to 1.02 over the following 80k steps. The mean action from phase0 is worth
      # keeping; the collapsed std and lr are not. Reset both on entry.
      reset_exploration_on_entry: true
      # terrain: rough
      num_envs: 2000
      action_scale: 0.25
      observation_noise_scale: 0.05
      max_timesteps: 1200000
      episode_length_s: 20.0
      base_angle_termination_thresh: 0.7
    domain_randomization:
      joint_friction_range: [0.03, 0.3]
    events:
      enable_pushes: true
      push_velocity_range: [-0.4, 0.4]
    rewards:
      rew_scale_alive: 1.0
      rew_scale_track_lin_vel_xy_exp: 1.5
      rew_scale_track_ang_vel_z_exp: 0.75

      rew_scale_lin_vel_z_l2: -2.0
      rew_scale_ang_vel_xy_l2: -0.05
      rew_scale_flat_orientation_l2: -5.0

      rew_scale_dof_torques_l2: -0.0002
      rew_scale_dof_acc_l2: -3.0e-7
      rew_scale_action_rate_l2: -0.01

      rew_scale_foot_height_reward: 0.4
      # Standing on four feet costs 2 * 0.5 = 1.0/step, exactly cancelling rew_scale_alive.
      # A trot (two feet down) pays 0. Dial this down if the robot balances on two legs instead
      # of stepping; dial it up if it keeps all four planted.
      rew_scale_feet_grounded: -0.5
      target_foot_height: 0.08
      foot_height_sigma: 0.005
    commands:
      command_lin_vel_std: 0.5
      command_ang_vel_std: 0.5
      vel_tracking_sigma_exp: 0.0
      command_x_range: [-1.0, 1.0]
      command_y_range: [-1.0, 1.0]
      command_yaw_range: [-1.0, 1.0]
      command_resampling_time: 6.0
      static_velocity_threshold: 0.02
      static_command_ramp: 0.1
      zero_command_fraction: 0.05

  phase2_torque:
    inherits: default
    env:
      control_mode: torque
      torque_scale: 7.0
      # terrain: rough
      num_envs: 2000
      action_scale: 0.25
      observation_noise_scale: 0.05
      max_timesteps: 1200000
      episode_length_s: 20.0
      base_angle_termination_thresh: 0.7
    domain_randomization:
      joint_friction_range: [0.03, 0.3]
    events:
      enable_pushes: true
      push_velocity_range: [-0.4, 0.4]
    rewards:
      rew_scale_alive: 1.0
      rew_scale_track_lin_vel_xy_exp: 1.5
      rew_scale_track_ang_vel_z_exp: 0.75

      rew_scale_lin_vel_z_l2: -2.0
      rew_scale_ang_vel_xy_l2: -0.05
      rew_scale_flat_orientation_l2: -5.0

      rew_scale_dof_torques_l2: -0.0002
      rew_scale_dof_acc_l2: -3.0e-7
      rew_scale_action_rate_l2: -0.01

      rew_scale_foot_height_penalty: -0.4
      # Inert for a trot (two feet down), so keeping it on costs a settled gait nothing --
      # it is here so the policy cannot quietly go back to standing on all four.
      rew_scale_feet_grounded: -0.5
      target_foot_height: 0.08
      foot_height_sigma: 0.005

      rew_scale_foot_landing_vel: -0.3
      foot_landing_vel_sigma: 0.6

      rew_scale_dof_pos_l2_stance: -0.5

      rew_scale_gait_phase_sym: -0.15
    commands:
      command_lin_vel_std: 0.5
      command_ang_vel_std: 0.5
      vel_tracking_sigma_exp: 0.0
      command_x_range: [-1.0, 1.0]
      command_y_range: [-1.0, 1.0]
      command_yaw_range: [-1.0, 1.0]
      command_resampling_time: 6.0
      static_velocity_threshold: 0.02
      static_command_ramp: 0.1
      zero_command_fraction: 0.05
      # NOT set here, matching where you put it. If the landing grace is wanted for the whole
      # torque arm rather than just phase1, add standby_duration_s: 3.0 to this block too.

  # ══════════════════════════════════════════════════════════════════════════
  # PAPER REPRODUCTION -- Dowdy & Chagas Vaz, "Towards Torque-Driven Reinforcement
  # Learning for Quadruped Locomotion", IEEE/SICE SII 2026, Table III.
  #
  # Every repo reward is zeroed and the paper's 16 terms carry the whole reward. They are not
  # interchangeable: most of the paper's terms are L1 norms where this repo squares, so mixing
  # the two sets would double-charge the same physics at incomparable magnitudes.
  #
  # THE POINT OF THIS PHASE is the Gait term at weight 10.0 -- the largest in the table. It is
  # DENSE (every step, not per landing), so a clean trot earns +10/step against an alive weight
  # of 0.75, where the repo's gait terms top out near 0.15 charged per event. The prize for
  # finding a gait goes from ~1% of the per-step reward to 13x the alive term.
  # It is NOT a gradient out of standing: measured on this reconstruction, standing scores
  # ~0.0003 and underflows to 0, so it still takes exploration stumbling into a near-trot before
  # anything pays. If that never happens this will plateau standing like the last five runs.
  #
  # WATCH THE AIR-TIME TERM'S SIGN. Unclamped at weight 5.0 it penalises every swing shorter
  # than paper_air_time_offset (0.3 s): 0.12 s pays -0.90, 0.25 s pays -0.25. Every policy that
  # walks in this repo swings in 0.12-0.25 s, so on a Go2 this term charges for stepping until
  # the swing exceeds 0.3 s. That threshold suits the paper's B1 (much heavier, slower cadence).
  # Try paper_air_time_offset: 0.15 if the robot refuses to step but the gait term is climbing.
  #
  # WHAT IS NOT COPIED HERE (all outside the reward function, all worth trying next):
  #   - entropy_loss_scale: paper 0.0025, this repo 0.0. Given std collapsed to the floor by
  #     320k steps in every torque run, this is the most likely single fix after the rewards.
  #     It lives in agents/skrl_ppo_cfg.yaml, shared by every phase, so it is left alone here.
  #   - Observations: the paper feeds linear ACCELERATION, previous applied torque, foot contact
  #     and a quaternion orientation, and deliberately omits base linear velocity. This repo's
  #     obs includes base_lin_vel. Changing it moves the observation space and invalidates
  #     every checkpoint and the deployment path.
  #   - torque_scale: paper uses 30.0 on a B1 whose actuators are +-140 N*m -- 21% of the
  #     envelope. The equivalent on a Go2 (23.5 N*m) is ~5.0, against the 7.0 set here.
  #   - Their robot is a B1 (much heavier), 4096 envs, 20k iterations, lr 1e-3, target KL 0.01.
  # ══════════════════════════════════════════════════════════════════════════
  phase_paper_torque:
    inherits: default
    env:
      control_mode: torque
      # Paper uses 30.0 on a B1 whose actuators are +-140 N*m -- 21% of the envelope, chosen so
      # exploration stays in a "stable, task-relevant" torque band. 21% of a Go2's 23.5 N*m is
      # 5.0. Transferring the RATIO, not the literal 30.0, which on a Go2 would be 128% of the
      # actuator limit and would mean the opposite of what the paper intended.
      torque_scale: 5.0
      # Table II observation space: no base linear velocity, plus linear acceleration, previous
      # applied torque and foot contact. 65-dim. See QuadrupedEnv._paper_observations.
      obs_mode: paper
      terrain: rough
      # Paper runs 4096. Drop to 2000 if this does not fit in VRAM.
      num_envs: 4096
      action_scale: 0.25
      # Unused in paper obs mode -- Table II gives per-term noise instead, applied in
      # _paper_observations. Left here only so the key exists.
      observation_noise_scale: 0.0
      # Paper trains 20,000 policy updates. train.py scales `rollouts` by the control-rate ratio,
      # so at 200 Hz (torque decimation 1) that is 128 per update -> 20000 * 128 = 2.56M steps.
      max_timesteps: 2560000
      episode_length_s: 20.0
      base_angle_termination_thresh: 0.7
      reward_dt_ref: 0.02
      joint_limit_barrier_stiffness: 25.0
    domain_randomization:
      # Table I. Terms this repo has no equivalent for are simply absent; terms this repo has
      # that Table I does not list (joint stiffness/PD damping, action latency, motor backlash)
      # stay at the default block's zeros, so only the paper's randomisation is active.
      foot_friction_range: [0.4, 1.1]        # "New"   -- resampled, not perturbed
      com_displacement_range: [-0.025, 0.025] # "Add"
      link_mass_scale_range: [0.8, 1.3]      # "Scale" -- every body, not just the trunk
      reset_body_vel_range: [-0.25, 0.25]    # "Add"
      reset_body_pos_range: [-0.5, 0.5]      # "Add"
      reset_body_ori_range: [-0.02, 0.02]    # "Add"
      reset_joint_pos_range: [-0.3, 0.3]     # "Scale" in the table; read as a range, as for the
      reset_joint_vel_range: [-2.5, 2.5]     #   others -- a "scale" of -2.5 is not meaningful
    events:
      # Table I text: pushes every 10-15 s setting base linear velocity in (-0.5, 0.5) m/s.
      # The event term's interval_range_s is already (10.0, 15.0).
      enable_pushes: true
      push_velocity_range: [-0.5, 0.5]
    rewards:
      # Table III, rewards
      rew_scale_paper_alive: 0.75
      rew_scale_paper_feet_air_time: 5.0
      rew_scale_paper_track_lin_vel: 7.0
      rew_scale_paper_track_ang_vel: 5.0
      rew_scale_paper_gait: 10.0
      # Table III, penalties
      rew_scale_paper_action_smooth: -0.6
      rew_scale_paper_air_time_var: -1.0
      rew_scale_paper_base_motion: -2.0
      rew_scale_paper_base_orientation: -3.0
      rew_scale_paper_foot_slip: -0.5
      rew_scale_paper_dof_pos: -0.7
      # SCALED: -0.0005 -> -0.003. ||tau|| is an absolute N*m quantity and the B1's actuator
      # envelope is 140 N*m against this Go2's 23.5 -- a 5.96x ratio, so the paper's weight is
      # ~6x weaker here for the same relative effort. Measured check: this robot walks at
      # ||tau||=15.3 N*m, so -0.003 costs -0.046/step, which is what this repo's own
      # dof_torques_l2 was already charging (-0.047). Two independent routes, same answer.
      rew_scale_paper_dof_torque: -0.003
      # NOT scaled, deliberately. Joint accelerations do not follow actuator size -- they go as
      # g/L, so this robot's are ~1.6x the B1's for equivalent motion and the paper's weight
      # already bites harder here (-0.0079/step at the measured ||theta_ddot|| = 316).
      rew_scale_paper_dof_acc: -0.000025
      rew_scale_paper_dof_vel: -0.01
      rew_scale_paper_thigh_contact: -1.0
      rew_scale_paper_calf_contact: -0.2
      # ── SCALED FROM THE PAPER'S B1 TO THIS GO2 ── everything above is verbatim; these are
      # not, because they are tied to the robot's size and would mean something different here.
      #
      # Air-time offset 0.3 -> 0.15. Unclamped, this term penalises every swing SHORTER than the
      # offset. Measured swing times of the policies that walk in this repo: cp7 0.12 s,
      # NiceGait7 ~0.20 s, Basic4 ~0.25 s -- all negative at 0.3, so the paper's value pays a Go2
      # for NOT stepping. 0.15 puts this repo's own measured cadence on the positive side.
      # (Leg-length scaling alone gives 0.24, still above most measured swings -- the
      # measurement is the better guide.)
      paper_air_time_offset: 0.15
      # Linear tracking tolerance 0.25 -> 0.125, scaled with the command range below so the
      # RELATIVE tightness matches the paper: their 0.25 is ~8% of a 3 m/s top speed, 0.125 is
      # ~8% of the 1.5 m/s this robot is asked for.
      paper_vel_tracking_sigma: 0.125
      # Angular NOT scaled. A smaller quadruped is slower in m/s but faster in rad/s
      # (omega ~ sqrt(g/L)), so the paper's tolerance is already right here.
      paper_ang_tracking_sigma: 0.25
      # Not a paper value at all -- Table III never defines l_sync/l_async. Chosen against this
      # robot's measured cadence (swing 0.12-0.25 s, stride ~0.4-0.5 s): at 0.04 a trot skewed by
      # 30 ms still scores 0.84 and by 60 ms scores 0.49, so an emerging gait gets partial
      # credit, while standing reads 0.0003 and underflows. 0.01 gives almost no partial credit
      # (0.49 at 30 ms); 0.08 pays standing 0.018, the one thing this term must never do.
      paper_gait_sigma: 0.04
      # Closes a degenerate solution in the gait term: it compares only DIFFERENCES of air and
      # contact times, so four feet chattering at 0.01 s score a perfect 1.0, identically to a
      # clean trot. The 2026-08-27 run found exactly that. Gates the gait reward on the last
      # completed swing duration. Match it to paper_air_time_offset.
      paper_gait_min_swing: 0.15
    commands:
      # Paper's ranges verbatim. NOTE these are B1 numbers: 3 m/s forward on a Go2 is roughly
      # 3x anything this repo has ever measured (best eval: 0.94 m/s at a 1.0 command), so most
      # of the command distribution is unreachable and the tracking reward will sit low no
      # matter how good the gait is. Narrow to [-1.0, 1.0] if you want the reward readable.
      # command_lin_vel_std / vel_tracking_sigma_exp are unused by the paper tracking terms,
      # which divide by paper_vel_tracking_sigma / paper_ang_tracking_sigma instead.
      command_lin_vel_std: 0.5
      command_ang_vel_std: 0.5
      vel_tracking_sigma_exp: 0.0
      # SCALED. The paper's (-2.0, 3.0) is a B1 that reaches 3.5 m/s; the best this repo has
      # measured on a Go2 is 0.94 m/s at a 1.0 command, so most of that distribution is
      # physically unreachable and the tracking term would read ~0 however good the gait is.
      # Paper's 2:3 backward:forward asymmetry kept, scaled to what this robot can be asked
      # for. Yaw left at the paper's value -- angular speed is where a small quadruped is
      # genuinely competitive.
      command_x_range: [-1.0, 1.5]
      command_y_range: [-0.75, 0.75]
      command_yaw_range: [-2.0, 2.0]
      command_resampling_time: 6.0
      static_velocity_threshold: 0.02
      static_command_ramp: 0.1
      zero_command_fraction: 0.05
