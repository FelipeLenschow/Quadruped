# Quadruped Training Phases Configuration
#
# Usage: Set the QUADRUPED_TRAINING_PHASE environment variable before running train.py
# Example: export QUADRUPED_TRAINING_PHASE=phase2

default: &default
  env:
    robot_cfg: GO2
    terrain: flat
    num_envs: 6000
    action_scale: 0.25
    observation_noise_scale: 0.05
    max_timesteps: 300000
  domain_randomization:
    # Zeroed out for now; available for future activation.
    joint_friction_range: [0.0, 0.0]
    joint_stiffness_range: [0.0, 0.0]     # Dormant (uses robot default)
    joint_pd_damping_range: [0.0, 0.0]    # Dormant (uses robot default)
    action_latency_range_steps: [0, 0]
    motor_backlash_range: [0.0, 0.0]
  events:
    enable_pushes: false
    push_velocity_range: [-0.5, 0.5]
  rewards:
    # Exact IsaacLab Go2 fast-learning reference rewards
    rew_scale_alive: 1.0
    rew_scale_undesired_contacts: 0.0
    rew_scale_track_lin_vel_xy_exp: 1.5
    rew_scale_track_ang_vel_z_exp: 0.75
    rew_scale_feet_air_time: 0.01
    rew_scale_foot_height_exp: 0.2
    target_foot_height: 0.1
    rew_scale_flat_orientation_l2: -5.0
    rew_scale_lin_vel_z_l2: -2.0
    rew_scale_ang_vel_xy_l2: -0.05
    rew_scale_dof_pos_l2: -0.2
    rew_scale_dof_torques_l2: -0.0002
    rew_scale_dof_acc_l2: -2.5e-7
    rew_scale_action_rate_l2: -0.01
    rew_scale_feet_air_penalty: -0.05
    rew_scale_feet_air_penalty_static: -5.0
    rew_scale_joint_vel_l2_static: -0.1
    rew_scale_base_height_l2: 0.0
    target_base_height: 0.32
    rew_scale_trot_symmetry: 0.0
  commands:
    command_lin_vel_std: 0.5
    command_ang_vel_std: 0.5
    static_velocity_threshold: 0.1
    zero_command_fraction: 0.25

phases:
  # Phase 1: The Foundation - Zero DR, focus on pure gait stability (Default Go2 example)
  phase1:
    inherits: default

  # Phase 2: Gait Shaping - Enforce diagonal leg symmetry for a beautiful trot
  phase2:
    inherits: phase1
    rewards:
      rew_scale_trot_symmetry: -0.1
      rew_scale_feet_air_time: 0.1       # Encourage longer suspension (more bouncy)
      rew_scale_foot_height_exp: 0.5     # Strongly reward hitting the target height
      target_foot_height: 0.15           # Lift foot to 15cm (high-stepping)
    env:
      robot_cfg: RANDOM

  # Phase 3: Physical Perturbations - Light DR (Friction, Backlash, Pushes)
  phase3:
    inherits: phase2
    env:
      terrain: rough
      max_timesteps: 100000
    domain_randomization:
      joint_friction_range: [-0.02, 0.02]
      motor_backlash_range: [-0.02, 0.02]
    events:
      enable_pushes: true
      push_velocity_range: [-0.5, 0.5]

  # Phase 4: The Sim2Real Killer - Heavy DR & Latency
  phase4:
    inherits: phase3
    env:
      observation_noise_scale: 0.1
    domain_randomization:
      joint_friction_range: [-0.04, 0.04]
      action_latency_range_steps: [0, 1]
      motor_backlash_range: [-0.04, 0.04]
    events:
      push_velocity_range: [-1.0, 1.0]

  # --- ABLATION STUDY FOR PHASE 5 ---
  # Run these one by one to find out which DR is killing the policy.

  # 1. All heavy randomizations active (The baseline failure case)
  phase5:
    inherits: phase4
    env:
      max_timesteps: 300000
      robot_cfg: RANDOM
    domain_randomization:
      joint_stiffness_range: [-5.0, 5.0]
      joint_pd_damping_range: [-0.1, 0.1]
      # com_displacement_range: [-0.05, 0.1]
      payload_mass_range: [-1.0, 3.0]

  # Phase 6: CoM Randomization
  phase6:
    inherits: phase5
    domain_randomization:
      com_displacement_range: [-0.05, 0.1]
