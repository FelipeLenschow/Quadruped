seed: 42


# Models are instantiated using skrl's model instantiator utility
# https://skrl.readthedocs.io/en/latest/api/utils/model_instantiators.html
models:
  # Must be True: the value function now reads a wider, privileged input than the
  # policy, so they cannot share a trunk.
  separate: True
  policy:  # see gaussian_model parameters
    class: GaussianMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    network:
      - name: net
        input: OBSERVATIONS
        layers: [512, 256, 128]
        activations: elu
    output: ACTIONS
  value:  # see deterministic_model parameters
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        # STATES, not OBSERVATIONS: the critic reads DirectRLEnvCfg.state_space
        # (the actor observation plus base_lin_vel, true foot contact, per-foot
        # load and base height), which the env returns under the "critic" key.
        input: STATES
        layers: [512, 256, 128]
        activations: elu
    output: ONE


# Rollout memory
# https://skrl.readthedocs.io/en/latest/api/memories/random.html
memory:
  class: RandomMemory
  memory_size: -1  # automatically determined (same as agent:rollouts)


# PPO agent configuration (field names are from PPO_DEFAULT_CONFIG)
# https://skrl.readthedocs.io/en/latest/api/agents/ppo.html
agent:
  class: PPO
  rollouts: 32
  learning_epochs: 8
  mini_batches: 8
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 5.0e-04
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.008
  # Both must be spelled out. skrl's Runner renames state_preprocessor ->
  # observation_preprocessor when the latter is missing (and deletes the original),
  # which is right for a symmetric setup but would leave the critic's privileged
  # input unnormalised here -- and its terms (m/s, newtons/mg, metres) are on wildly
  # different scales.
  observation_preprocessor: RunningStandardScaler
  observation_preprocessor_kwargs: null
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True
  # Fallback only -- training_phases.yaml's `agent:` block owns this value and
  # train.py overwrites it before the Runner is built (and again at every curriculum
  # transition). Change it there, per phase, not here.
  entropy_loss_scale: 0.0
  value_loss_scale: 2.0
  kl_threshold: 0.0
  rewards_shaper_scale: 0.1
  # Episodes run 949-972 steps against a 1000-step limit (episode_length_s 20.0 /
  # step_dt 0.02), so nearly every episode ends in TRUNCATION, not termination.
  # With this off, skrl skips the `rewards += discount * V(next_obs) * truncated`
  # correction and instead lets the GAE recursion run across the episode boundary,
  # mixing the post-reset value into the pre-reset advantage. This is the setting
  # the skrl >= 2.1.0 pin was for -- the upgrade supplied the option, but the
  # option itself was never switched on, and the ~2.7 ceiling stayed put across
  # Basic4 (2730), Final2 (2717) and Final (2729).
  time_limit_bootstrap: True
  # logging and checkpoint
  experiment:
    directory: "quadruped_direct"
    experiment_name: ""
    # Fixed, not `auto`. skrl's auto sets write_interval = timesteps/100, so the plotted value
    # is a mean over a window whose width depends on max_timesteps -- a 500k run and a 1M run
    # average over different windows and their early curves are not comparable.
    write_interval: 1000
    # Also fixed: auto is timesteps/10, so best_agent gets chosen from a different candidate
    # set depending on the budget (10 snapshots for 500k, 10 for 1M but at different steps).
    checkpoint_interval: 10000


# Sequential trainer
# https://skrl.readthedocs.io/en/latest/api/trainers/sequential.html
trainer:
  class: SequentialTrainer
  timesteps: 300000
  environment_info: log