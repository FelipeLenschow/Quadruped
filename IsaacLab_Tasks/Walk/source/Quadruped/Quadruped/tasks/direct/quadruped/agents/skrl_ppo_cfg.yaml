seed: 42


# Models are instantiated using skrl's model instantiator utility
# https://skrl.readthedocs.io/en/latest/api/utils/model_instantiators.html
models:
  separate: False
  policy:  # see gaussian_model parameters
    class: GaussianMixin
    clip_actions: False
    clip_log_std: True
    # Back to skrl's default, i.e. NO floor. The -2.9 floor was a workaround for std being
    # annealed to nothing with entropy_loss_scale at 0.0; the paper (Dowdy & Chagas Vaz, SII
    # 2026) instead runs entropy_loss_scale 0.0025, which resists the collapse at its source
    # rather than clamping the symptom. Running both would mean the entropy bonus pushing
    # against a clamp that zeroes its gradient. If std still collapses with the entropy term
    # on, raise entropy_loss_scale rather than restoring this floor.
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    network:
      - name: net
        input: OBSERVATIONS
        layers: [512, 256, 128]
        activations: elu
    output: ACTIONS
  value:  # see deterministic_model parameters
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: OBSERVATIONS
        layers: [512, 256, 128]
        activations: elu
    output: ONE


# Rollout memory
# https://skrl.readthedocs.io/en/latest/api/memories/random.html
memory:
  class: RandomMemory
  memory_size: -1  # automatically determined (same as agent:rollouts)


# PPO agent configuration (field names are from PPO_DEFAULT_CONFIG)
# https://skrl.readthedocs.io/en/latest/api/agents/ppo.html
agent:
  class: PPO
  rollouts: 32
  learning_epochs: 8
  mini_batches: 8
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 1.0e-03
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.01
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True
  # Paper value. This is the single most likely fix for the std collapse that pinned every
  # torque run at the exploration floor by ~320k steps -- it was 0.0 here, so nothing
  # opposed the policy annealing its own exploration away.
  entropy_loss_scale: 0.0025
  value_loss_scale: 2.0
  kl_threshold: 0.0
  rewards_shaper_scale: 0.1
  time_limit_bootstrap: False
  # logging and checkpoint
  experiment:
    directory: "quadruped_direct"
    experiment_name: ""
    # Fixed, not `auto`. skrl's auto sets write_interval = timesteps/100, so the plotted value
    # is a mean over a window whose width depends on max_timesteps -- a 500k run and a 1M run
    # average over different windows and their early curves are not comparable.
    write_interval: 1000
    # Also fixed: auto is timesteps/10, so best_agent gets chosen from a different candidate
    # set depending on the budget (10 snapshots for 500k, 10 for 1M but at different steps).
    checkpoint_interval: 10000


# Sequential trainer
# https://skrl.readthedocs.io/en/latest/api/trainers/sequential.html
trainer:
  class: SequentialTrainer
  timesteps: 300000
  environment_info: log