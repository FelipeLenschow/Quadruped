# Quadruped Training Phases Configuration
#
# Design rationale:
#   - Phase 1: CLEAN — no DR, no pushes. Just learn to walk.
#   - Phase 2: Add friction DR + pushes + GRF balance (the cp5 hardening)
#   - Phase 3+: Terrain, multi-robot, sim2real DR
#   - Trot symmetry penalties REMOVED (they fight natural gait emergence)
#
# Usage: export QUADRUPED_TRAINING_PHASE=phase1   (single phase)
#        export QUADRUPED_TRAINING_PHASE=phase1_onward  (sequential curriculum)

default: &default
  env:
    robot_cfg: GO2
    terrain: flat
    num_envs: 6000
    action_scale: 0.25
    observation_noise_scale: 0.0
    max_timesteps: 25000
  domain_randomization:
    joint_friction_range: [0.0, 0.0]
    joint_stiffness_range: [0.0, 0.0]
    joint_pd_damping_range: [0.0, 0.0]
    action_latency_range_steps: [0, 0]
    motor_backlash_range: [0.0, 0.0]
    payload_mass_range: [0.0, 0.0]
    com_displacement_range: [0.0, 0.0]
  events:
    enable_pushes: false
    push_velocity_range: [-0.5, 0.5]
  rewards:
    # ── Positive rewards ──
    rew_scale_alive: 1.0
    rew_scale_track_lin_vel_xy_exp: 3.0
    rew_scale_track_ang_vel_z_exp: 2.5
    rew_scale_feet_air_time: 0.0
    target_feet_air_time: 0.2
    rew_scale_foot_height_exp: 0.5
    target_foot_height: 0.1
    # ── Stability penalties ──
    rew_scale_flat_orientation_l2: -10.0
    rew_scale_lin_vel_z_l2: -2.0
    rew_scale_ang_vel_xy_l2: -0.1
    rew_scale_dof_pos_l2: -0.2
    rew_scale_max_air_feet: 0.00
    # ── Smoothness / efficiency penalties ──
    rew_scale_dof_torques_l2: -0.0002
    rew_scale_dof_acc_l2: -2.5e-7
    rew_scale_action_rate_l2: -0.01
    rew_scale_base_acc_l2: -0.0003
    # ── Standing still penalties ──
    rew_scale_feet_air_penalty: -0.005
    rew_scale_feet_air_penalty_static: -5.0
    rew_scale_joint_vel_l2_static: -1.0e-5
    # ── Disabled ──
    rew_scale_undesired_contacts: 0.0
    rew_scale_base_height_l2: 0.0
    target_base_height: 0.28
    rew_scale_trot_symmetry: 0.0
    hip_sym_multiplier: 3.0
    rew_scale_torque_symmetry: 0.0
    rew_scale_grf_balance: 0.0
    rew_scale_grf_target: 0.0
    rew_scale_max_contact_force: 0.0
    max_contact_force_pct: 0.75
    rew_scale_pos_deviation_l1: 0.0
    max_pos_leash: 0.5
    # ── Gait phase clock ──
    rew_scale_gait_phase: 1.0            # Reward for lifting feet in sync with phase clock
    gait_swing_sigma: 0.1                # Swing window width as fraction of cycle
    rew_scale_gait_phase_l1: -0.5        # L1 penalty for lifting feet outside designated swing window
    rew_scale_gait_missed_lift: 0.0      # Penalty for staying grounded during swing window (symmetric to gait reward)
    # gait frequency: f(x) = 0.3(1 - e^(-7.5x)) + 1.3x, x = effective cmd speed (m/s)
    # Gait pattern offsets: [FL, FR, RL, RR] as fraction of cycle [0, 1)
    #   Trot (diagonal pairs): FL+RR vs FR+RL  → [0.0, 0.5, 0.5, 0.0]
    gait_offsets: [0.0, 0.5, 0.5, 0.0]     # FL, FR, RL, RR

  commands:
    command_lin_vel_std: 0.3
    command_ang_vel_std: 0.3
    command_x_range: [-0.8, 0.8]
    command_y_range: [-0.5, 0.5]
    command_yaw_range: [-0.8, 0.8]
    command_resampling_time: 10.0
    static_velocity_threshold: 0.05
    zero_command_fraction: 0.0
    standby_duration_s: 0.0
    x_only_command_fraction: 0.05
    y_only_command_fraction: 0.05
    yaw_only_command_fraction: 0.10

phases:
  # Phase 1: Learn to walk with trot symmetry to prevent pace gait
  phase1:
    inherits: default
    rewards:
      rew_scale_trot_symmetry: -0.1
      rew_scale_grf_balance: -0.4          # Penalize uneven force distribution to prevent dragging
      rew_scale_grf_target: -0.15           # Penalize deviation from mg/n weight share
      rew_scale_max_contact_force: -1.0
      rew_scale_gait_missed_lift: -0.5     # Penalize staying grounded when clock says lift

  # Phase 2: Hardening — drop symmetry constraint, add DR + pushes
  phase2:
    inherits: phase1
    env:
      observation_noise_scale: 0.05
    domain_randomization:
      joint_friction_range: [0.03, 0.3]
    events:
      enable_pushes: true
      push_velocity_range: [-0.2, 0.2]
    rewards:
      rew_scale_trot_symmetry: -0.03         # Reduced but kept — maintains diagonal coordination
      rew_scale_grf_balance: -0.2
      rew_scale_base_height_l2: -10.0
    commands:
      zero_command_fraction: 0.10

  # Phase 3: Terrain + stronger pushes
  phase3:
    inherits: phase2
    env:
      terrain: rough
      robot_cfg: RANDOM
    domain_randomization:
      motor_backlash_range: [-0.02, 0.02]
    events:
      push_velocity_range: [-0.4, 0.4]

  # Phase 4: Heavy DR + Multi-Robot
  phase4:
    inherits: phase3
    env:
      observation_noise_scale: 0.1
    domain_randomization:
      joint_friction_range: [0.03, 0.4]
      action_latency_range_steps: [0, 1]
      motor_backlash_range: [-0.04, 0.04]
    events:
      push_velocity_range: [-0.6, 0.6]

  # Phase 5: Sim2Real — Max randomization
  phase5:
    inherits: phase4
    domain_randomization:
      joint_stiffness_range: [-5.0, 5.0]
      joint_pd_damping_range: [-0.1, 0.1]
      com_displacement_range: [-0.05, 0.1]
      payload_mass_range: [-1.0, 3.0]

  # Phase 6: Stabilization
  phase6:
    inherits: phase5
    env:
      max_timesteps: 100000
    
