# Quadruped Training Phases Configuration
#
# Design rationale:
#   - Phase 1: CLEAN — no DR, no pushes. Just learn to walk.
#   - Phase 2: Add friction DR + pushes + GRF balance (the cp5 hardening)
#   - Phase 3+: Terrain, multi-robot, sim2real DR
#
# Usage: export QUADRUPED_TRAINING_PHASE=phase1   (single phase)
#        export QUADRUPED_TRAINING_PHASE=phase1_onward  (sequential curriculum)

default: &default
  env:
    obs_history_len: 10
    robot_cfg: GO2
    terrain: flat
    num_envs: 6000
    action_scale: 0.25
    observation_noise_scale: 0.0
    max_timesteps: 50000
    episode_length_s: 20.0
    base_angle_termination_thresh: 0.7
  domain_randomization:
    joint_friction_range: [0.0, 0.0]
    joint_stiffness_range: [0.0, 0.0]
    joint_pd_damping_range: [0.0, 0.0]
    action_latency_range_steps: [0, 0]
    motor_backlash_range: [0.0, 0.0]
    payload_mass_range: [-1.0, 3.0]
    com_displacement_range: [0.0, 0.0]
  events:
    enable_pushes: false
    push_velocity_range: [-0.5, 0.5]
  rewards:
    # ── Positive rewards ──
    rew_scale_alive: 1.0
    rew_scale_track_lin_vel_xy_exp: 1.5
    rew_scale_track_ang_vel_z_exp: 1.5
    # Feet air time: potential-based shaping. phi(t) = exp(-(air_time-target)^2/sigma) is treated
    # as a potential; the reward paid every step while airborne is d(phi)/dt * step_dt (positive
    # while air_time is approaching target, zero at the peak, negative past it), not phi(t) itself.
    # Summed over one swing this telescopes (fundamental theorem of calculus) back to
    # phi(landing) - phi(0) -- ~0.96 for a swing landing right at target_feet_air_time, ~0.56 for
    # one that overshoots to 0.35s -- so rew_scale_feet_air_time is calibrated the same as if this
    # were still a single lump-sum reward at landing, just paid out densely instead of all at once.
    # Replaces the old hard clamp -- (air_time - threshold).clamp(min=0) had zero gradient below
    # the threshold and unbounded reward above it, which is what silently killed this term twice
    # when the threshold got raised past what the policy could reach. 0.25s at ~50% duty factor
    # targets roughly a 2Hz cruise cadence.
    rew_scale_feet_air_time: 1.0
    target_feet_air_time: 0.25
    feet_air_time_sigma: 0.02
    # Foot height: same exp shape as before, but sigma is now tunable instead of hardcoded
    # (was 0.005 in code -- at the 18cm target below, a foot even 10cm off gets ~0 reward at
    # that sigma, which is exactly the kind of silent-zero trap that hit feet_air_time).
    rew_scale_foot_height_exp: 0.25
    target_foot_height: 0.18
    foot_height_sigma: 0.01
    # ── Stability penalties ──
    rew_scale_flat_orientation_l2: -5.0
    rew_scale_lin_vel_z_l2: -2.0
    rew_scale_ang_vel_xy_l2: -0.05
    rew_scale_dof_pos_l2: -0.2
    rew_scale_base_acc_l2: -0.02
    # ── Smoothness / efficiency penalties ──
    rew_scale_dof_torques_l2: -0.0002
    rew_scale_dof_acc_l2: -2.5e-7
    rew_scale_action_rate_l2: -0.01
    # ── Standing still / airborne-time penalties ──
    # feet_air_penalty grows with how long a foot has been continuously airborne
    # (self.feet_air_time, resets to 0 on landing) instead of a flat per-airborne-foot cost --
    # a normal step stays cheap, a foot stuck hovering keeps accruing penalty. Integrates to
    # about -0.23 over a well-timed 0.25s swing, clearly under the ~+0.95 total from
    # rew_scale_feet_air_time above (see its comment) -- keep it that way or stepping stops
    # paying off. NOTE: rew_scale_feet_air_time's dphi/dt shaping now *also* goes negative once
    # a foot overstays past target_feet_air_time, so this may be partially redundant with that --
    # watch training data and consider dropping/shrinking this if so.
    rew_scale_feet_air_penalty: -0.15
    rew_scale_feet_air_penalty_static: -1.0
    rew_scale_joint_vel_l2_static: -1.0e-5
    # ── Disabled ──
    rew_scale_pos_deviation_l1: -1.0
    rew_scale_yaw_deviation_l1: 0.0
    rew_scale_undesired_contacts: 0.0 ###
    # Fixed global target doesn't make sense once robot_cfg=RANDOM mixes in smaller robots
    # (A1 stands notably lower than GO2). rew_scale_dof_pos_l2 above already regularizes each
    # robot toward its own default_joint_pos correctly (per-robot, from the sim), so leaving
    # this off rather than fighting it with one global height number. Worth a per-robot-type
    # target instead of just re-enabling this if base height turns out to actually need shaping.
    rew_scale_base_height_l2: 0.0
    target_base_height: 0.25
    # ── Ground reaction forces / impact ──
    rew_scale_grf_balance: 0.0
    rew_scale_grf_target: 0.0
    rew_scale_max_contact_force: -0.0005
    max_contact_force_pct: 0.75
    # ── Gait Phase Symmetry (all 6 leg pairs, offsets in cycles [0, 1]) ──
    # Trot defaults: diagonal in-phase (0.0), all others anti-phase (0.5)
    # NOTE: a leg pair only scores when its reference foot has struck recently -- a foot that
    # stops stepping entirely just drops out of the average rather than being penalized, so this
    # alone won't catch a fully-dead leg. It's a timing-precision term for legs that are already
    # stepping, not a replacement for whatever catches a leg that's stopped moving.
    rew_scale_gait_phase_sym: 0.0   # start disabled; enable when gait is stable
    gait_phase_offset_front: 0.5    # FL vs FR  (0.5 = anti-phase)
    gait_phase_offset_rear:  0.5    # RL vs RR  (0.5 = anti-phase)
    gait_phase_offset_left:  0.5    # FL vs RL  (0.5 = anti-phase)
    gait_phase_offset_right: 0.5    # FR vs RR  (0.5 = anti-phase)
    gait_phase_offset_diag1: 0.0    # FL vs RR  (0.0 = in-phase)
    gait_phase_offset_diag2: 0.0    # FR vs RL  (0.0 = in-phase)
  commands:
    command_lin_vel_std: 0.5
    command_ang_vel_std: 0.5
    vel_tracking_sigma_exp: 0.0   # exponent of |v_cmd| in dynamic sigma: denom = std * |v|^exp (0=fixed sigma, 2=dynamic)
    command_x_range: [-1.0, 1.0]
    command_y_range: [-1.0, 1.0]
    command_yaw_range: [-1.0, 1.0]
    command_resampling_time: 10.0
    static_velocity_threshold: 0.001
    max_pos_leash: 0.4
    max_yaw_leash: 0.5
    zero_command_fraction: 0.05
    standby_duration_s: 0.0
    x_only_command_fraction: 0.05
    y_only_command_fraction: 0.05
    yaw_only_command_fraction: 0.10

phases:
  # Phase 1: Learn to walk with trot symmetry to prevent pace gait
  phase1:
    inherits: default
    rewards:
      rew_scale_grf_balance: -0.4          # Penalize uneven force distribution to prevent dragging
      rew_scale_grf_target: -0.15           # Penalize deviation from mg/n weight share

  # Phase 2: Hardening — drop symmetry constraint, add DR + pushes
  phase2:
    inherits: phase1
    env:
      observation_noise_scale: 0.05
    domain_randomization:
      joint_friction_range: [0.03, 0.3]
    events:
      enable_pushes: true
      push_velocity_range: [-0.4, 0.4]
    rewards:
      rew_scale_grf_balance: -0.2
    commands:
      zero_command_fraction: 0.10
      vel_tracking_sigma_exp: 1.0

  # Phase 3: Terrain + stronger pushes
  phase3:
    inherits: phase2
    env:
      terrain: rough
      robot_cfg: RANDOM
    domain_randomization:
      motor_backlash_range: [-0.02, 0.02]
    events:
      push_velocity_range: [-0.8, 0.8]

  # Phase 4: Heavy DR + Multi-Robot
  phase4:
    inherits: phase3
    env:
      observation_noise_scale: 0.1
    domain_randomization:
      joint_friction_range: [0.03, 0.4]
      action_latency_range_steps: [0, 1]
      motor_backlash_range: [-0.04, 0.04]
    events:
      push_velocity_range: [-1.0, 1.0]

  # Phase 5: Sim2Real — Max randomization
  phase5:
    inherits: phase4
    domain_randomization:
      joint_stiffness_range: [-5.0, 5.0]
      joint_pd_damping_range: [-0.1, 0.1]
      com_displacement_range: [-0.05, 0.1]
      payload_mass_range: [-1.0, 3.0]

  # Phase 6: Stabilization
  phase6:
    inherits: phase5
    env:
      max_timesteps: 200000
    commands:
      vel_tracking_sigma_exp: 2.0
    