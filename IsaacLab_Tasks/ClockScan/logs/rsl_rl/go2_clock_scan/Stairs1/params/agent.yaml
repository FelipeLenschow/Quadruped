seed: 42
device: cuda:0
num_steps_per_env: 24
init_at_random_ep_len: true
max_iterations: 15000
empirical_normalization: {}
obs_groups: {}
clip_actions: 10.0
check_for_nan: true
save_interval: 100
experiment_name: go2_clock_scan
run_name: ''
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: true
load_run: 2026-10-28_19-23-21
load_checkpoint: model_46000.pt
class_name: OnPolicyRunner
actor:
  class_name: MLPModel
  hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: false
  distribution_cfg:
    class_name: clock_scan.tasks.locomotion.agents.distribution:BoundedGaussianDistribution
    init_std: 1.0
    std_type: scalar
    bound: 10.0
critic:
  class_name: MLPModel
  hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: false
  distribution_cfg: null
algorithm:
  class_name: PPO
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.001
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.01
  desired_kl: 0.01
  max_grad_norm: 1.0
  optimizer: adam
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  share_cnn_encoders: false
  rnd_cfg: null
  symmetry_cfg:
    use_data_augmentation: true
    use_mirror_loss: false
    data_augmentation_func: clock_scan.tasks.locomotion.mdp.symmetry:mirror_left_right
    mirror_loss_coeff: 1.0
policy: {}
