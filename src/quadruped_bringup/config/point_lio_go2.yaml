# Point-LIO (third_party/point_lio_ros2) on the Go2's built-in L1: real.launch.py lio:=true.
# Started from the port's unilidar_l1.yaml (Unitree's L1 values); the Go2-specific lines are commented.
/**:
    ros__parameters:
        odom_header_frame_id: "lio_odom"
        odom_child_frame_id: "lio_imu"
        use_imu_as_input: false
        prop_at_freq_of_imu: true
        check_satu: true
        init_map_size: 10
        point_filter_num: 1
        space_down_sample: true
        filter_size_surf: 0.1
        filter_size_map: 0.1
        cube_side_length: 1000.0
        runtime_pos_log_enable: false

        common:
            lid_topic: "/lidar/points"     # real_sensors: range-corrected, on this machine's clock
            imu_topic: "/lidar/imu"
            con_frame: false
            con_frame_num: 1
            cut_frame: false
            cut_frame_time_interval: 0.1
            time_lag_imu_to_lidar: 0.0

        preprocess:
            lidar_type: 5
            scan_line: 18
            timestamp_unit: 0
            blind: 0.5                     # also drops most of the robot's own body and front legs

        mapping:
            imu_en: true
            start_in_aggressive_motion: false
            extrinsic_est_en: false
            imu_time_inte: 0.004           # 1 / IMU rate; real_sensors logs the rate, set it from that
            satu_acc: 30.0
            satu_gyro: 35.0
            acc_norm: 9.81
            lidar_meas_cov: 0.01
            acc_cov_output: 500.0
            gyr_cov_output: 1000.0
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            imu_meas_acc_cov: 0.1
            imu_meas_omg_cov: 0.1
            gyr_cov_input: 0.01
            acc_cov_input: 0.1
            plane_thr: 0.1
            match_s: 81.0
            fov_degree: 180.0
            det_range: 100.0
            gravity_align: true
            gravity: [0.0, 0.0, -9.810]
            gravity_init: [0.0, 0.0, -9.810]
            # Lidar -> IMU, from lidar_imu_calib (gyro fit to the body IMU, 0.039 rad/s RMS): about identity,
            # as in Unitree's standalone L1 config.
            extrinsic_T: [0.007698, 0.014655, -0.00667]
            extrinsic_R: [0.9992, -0.0396, -0.0033,
                          0.0396,  0.9992,  0.0070,
                          0.0031, -0.0071,  1.0000]

        odometry:
            publish_odometry_without_downsample: true

        publish:
            path_en: true
            scan_publish_en: true
            scan_bodyframe_pub_en: false

        pcd_save:
            pcd_save_en: false             # real.launch.py lio_save:=true writes third_party/point_lio_ros2/PCD/scans.pcd
            interval: -1
