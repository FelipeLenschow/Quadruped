# Point-LIO (third_party/point_lio_ros2) on the Go2's built-in L1: lio.launch.py (launcher [L]).
# Started from the port's unilidar_l1.yaml (Unitree's L1 values); the Go2-specific lines are commented.
/**:
    ros__parameters:
        odom_header_frame_id: "lio_odom"
        odom_child_frame_id: "lio_imu"
        use_imu_as_input: false
        prop_at_freq_of_imu: true
        check_satu: true
        init_map_size: 3000              # first map from ~0.3 s of scans; one scan (mostly floor) let yaw spin. Start standing still
        point_filter_num: 1
        space_down_sample: true
        filter_size_surf: 0.1
        filter_size_map: 0.1
        cube_side_length: 1000.0
        runtime_pos_log_enable: false

        common:
            lid_topic: "/lidar/points"     # real_sensors: range-corrected, on this machine's clock
            imu_topic: "/lidar/imu"
            con_frame: false
            con_frame_num: 1
            cut_frame: false
            cut_frame_time_interval: 0.1
            time_lag_imu_to_lidar: 0.0

        preprocess:
            lidar_type: 5
            scan_line: 18
            timestamp_unit: 0
            blind: 0.1                     # real_sensors blanks the body (config.yaml real_lidar.body_box); 0.5 lost the floor within ~0.4 m

        mapping:
            imu_en: true
            start_in_aggressive_motion: false
            extrinsic_est_en: false
            imu_time_inte: 0.004           # 1 / IMU rate; real_sensors logs the rate, set it from that
            satu_acc: 30.0
            satu_gyro: 35.0
            acc_norm: 9.52                 # the Go2 body IMU's |g| at rest
            lidar_meas_cov: 0.01
            acc_cov_output: 500.0
            gyr_cov_output: 1000.0
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            imu_meas_acc_cov: 0.1
            imu_meas_omg_cov: 0.1
            gyr_cov_input: 0.01
            acc_cov_input: 0.1
            plane_thr: 0.1
            match_s: 81.0
            fov_degree: 180.0
            det_range: 100.0
            # /lidar/imu: the L1 gyro and the body IMU's accelerometer, in the body's axes. lio_odom is level, x forward.
            gravity_align: true
            gravity: [0.0, 0.0, -9.81]
            gravity_init: [0.0, 0.0, -9.81]
            # Lidar -> IMU: the IMU is in the body's axes, so this is config.yaml's real_lidar mount
            # (xyz, rpy [0.2171, 3.268, 2.0766]). Update both together; lidar_imu_calib prints it from the gyro too.
            extrinsic_T: [0.28945, 0.0, -0.046825]
            extrinsic_R: [ 0.4806, -0.8411,  0.2481,
                          -0.8678, -0.4969, -0.0033,
                           0.1261, -0.2137, -0.9687]

        odometry:
            publish_odometry_without_downsample: false   # true publishes pose and /tf for every point (~5 kHz): floods DDS and Wi-Fi

        publish:
            path_en: false                 # republishes the whole path every scan: grows without end (720 kB/s after 1 min)
            scan_publish_en: true
            scan_bodyframe_pub_en: false

        pcd_save:
            pcd_save_en: true
            interval: -1
