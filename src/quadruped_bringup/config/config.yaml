# Unitree Go2 Configuration
robot_type: "go2"

# --- Control & Gains ---
control:
  kp: 25.0                # Reverted from 80.0; high Kp over async IPC causes violent oscillations
  kd: 0.5                 # Reverted from 2.0 to match training physics
  decimation: 20          # Run policy at 50Hz (1000Hz PD / 20)
  action_scale: 0.25
  saturation_limit: 0.90  # 90% of physical capacity
  default_height: 0.33    # Target height for standing pose (m)

# --- Velocity command slew limit ---
# Per-axis limit on how fast the command reaching the policy may change, applied in the pipeline
# to every command source (joystick, keyboard, MCP, Nav2). Slowing down (toward zero, or through
# it on a reversal) uses the decel limits, so releasing the deadman still stops quickly. 0 = off.
# eval_mujoco turns it off, since it measures the response to a step.
command_slew:
  lin_accel: 1.5          # m/s^2, vx and vy
  lin_decel: 2.5
  yaw_accel: 3.0          # rad/s^2
  yaw_decel: 5.0

# --- Velocity command input ---
cmd_vel:
  timeout: 0.5            # s
  robot_state_rate: 10.0  # Hz

# --- Odometry (odom -> base, odom -> base_footprint TF) ---
# auto: leg odometry (estimator velocity + IMU) when the estimator is on (the launcher's "Use State Estimator"),
# the simulator's pose otherwise. The real robot has no simulator pose, so it is always leg odometry.
odometry:
  publish_tf: true
  source: auto            # auto | ground_truth | leg

# --- Lidar body filter (quadruped_perception lidar_filter) ---
# Points inside body_box (base frame, m) are the robot itself and are dropped; everything outside
# stays, including a person's legs beside the robot. y is wide because the walking gait splays the
# legs (hip abduction up to ~0.75 rad, foot centrelines at |y| 0.26 m) and the real L1 reads near
# returns a few cm long, so leg points reached |y| 0.33 m.
lidar_filter:
  frame: base
  body_box:
    x: [-0.45, 0.45]
    y: [-0.35, 0.35]
    z: [-0.50, 0.15]
  # Also drop points whose beam passed this close (m) to a thigh or calf (forward kinematics from the joint
  # states): a beam clipping a leg's edge returns a point smeared out past the leg. 0 disables.
  leg_radius: 0.045
  max_range: 20.0

# Real Go2 L1 lidar mount on the base (real_sensors). Gazebo uses the URDF's. lidar_level finds roll and
# pitch from the floor and keeps yaw. The yaw is ~120 deg about the lidar's own axis off the URDF's radar
# frame, measured by aligning the clouds before and after a straight 1.3 m walk against odometry.
real_lidar:
  xyz: [0.28945, 0.0, -0.046825]
  rpy: [0.2171, 3.2680, 2.0766]
  # The L1 reports every range this much too long (m); real_sensors pulls each point back along its ray.
  # Fitted to a wall at a tape-measured 1.60 m and the floor under the standing robot's feet (leg FK).
  range_offset: 0.12
  # The robot's own hips and legs (base frame, m): real_sensors blanks these points, so Point-LIO's blind can be
  # short and keep the floor next to the robot. z stops ~6 cm above the standing floor (-0.32).
  body_box:
    x: [-0.45, 0.32]
    y: [-0.35, 0.35]
    z: [-0.26, 0.15]
  # On this firmware only the L1 IMU's gyro is real (it matches the body IMU to 0.044 rad/s). Its acceleration
  # keeps z at ~9.8 and y at ~0 whatever the pose, while x climbs ~0.6 m/s^2 per second (lying, nose up 90 deg
  # and on its side: x 4.1, 10.3, 16.3), and its orientation turned 28 deg for a 90 deg tilt. So /lidar/imu is
  # the L1's gyro turned into the body's axes, with the body IMU's accelerometer (rt/lowstate).
  # point_lio_go2.yaml's extrinsic repeats xyz and rpy: change both together.

# Cameras (camera_bridge), one entry each. Every camera <name> publishes
#   /camera/<name>/image_raw/compressed, /camera/<name>/camera_info (once calibrated),
#   /camera/<name>/preview/compressed (small and slow, for the app; only while someone watches),
# and /cameras lists them all (JSON, latched). Fields:
#   source: unitree (the Go2's own front camera, JPEG over the SDK), v4l2 (any USB/UVC camera),
#           ros (an image topic from another driver: adds the compressed copy, preview and TF)
#   kind: rgb or thermal (thermal: 16-bit frames go out as PNG, the preview gets a colour map)
#   frame, xyz, rpy: the mount on the base; <frame>_optical is the image's frame
#   rate: Hz; preview_rate, preview_width: the app's preview
#   calibration: yaml from camera_calibration (default calibration/<name>.yaml); written by its Commit
#   sim_topic: in Gazebo, read this topic (source ros) instead; cameras without it are real-only
#   v4l2: device, width, height, fps, fourcc; ros: topic
cameras:
  front:
    source: unitree
    kind: rgb
    frame: front_camera
    xyz: [0.32715, 0.0, 0.04297]
    rpy: [0.0, 0.0, 0.0]
    rate: 15
    preview_rate: 2
    preview_width: 320
    sim_topic: /gazebo/front_camera/image
  # thermal:
  #   source: v4l2
  #   kind: thermal
  #   device: /dev/video0
  #   width: 256
  #   height: 192
  #   fourcc: Y16
  #   frame: thermal_camera
  #   xyz: [0.30, 0.0, 0.08]
  #   rpy: [0.0, 0.0, 0.0]
  #   rate: 9

# Open-vocabulary detection (object_detector, YOLOE) on one camera:
#   /camera/<camera>/detections (JSON) and /camera/<camera>/detections/image/compressed (boxes drawn).
#   model: a *-seg-pf.pt model names objects from its own 4,585-word vocabulary and ignores classes;
#          a *-seg.pt model looks only for classes. Downloaded to models/ on first use.
#   On the Jetson, `ros2 run quadruped_perception object_detector --export` builds a TensorRT engine
#   for this model, classes and imgsz (once, on the robot); the node uses it when it is there.
detector:
  camera: front
  model: models/yoloe-26s-seg-pf.pt
  classes: []
  rate: 5
  conf: 0.7
  imgsz: 640

# object_mapper: detector's objects on the map (lidar points inside each outline; the floor when none hit it),
#   merged within radius and published on /objects (JSON, latched) and /objects/markers (rviz) once seen
#   min_sightings times. Both see the object's front, so it is pushed back by half its width (at most
#   max_depth_shift). ignore: labels never mapped (people move, surfaces are not objects); max_box_fraction
#   and max_box_width drop boxes bigger or wider than that share of the image (whole-scene tags like "room",
#   or the floor). /objects/clear forgets them.
#   Check in Gazebo's nav world: `ros2 run quadruped_perception object_check`.
object_mapper:
  frame: map
  cloud: /lidar/points_filtered
  keep_s: 1.0
  max_range: 8.0
  radius: 0.5
  min_sightings: 3
  min_points: 3
  floor_z: 0.0
  max_box_fraction: 0.5
  max_box_width: 0.9
  max_depth_shift: 0.3
  ignore: [person, floor, ground, wall, ceiling, sky]

# mcp_server: the robot's tools for an LLM over HTTP, http://<robot>:<port>/mcp (launch arg mcp:=true).
#   Set QUADRUPED_MCP_TOKEN to require a bearer token. approach: metres go_to_object stops from an object;
#   visit_radius: a trick done this close to an object is marked done there; move is a Nav2 goal at most
#   max_move_m away; look's photo is shrunk to image_width px. visit: Nav2 to nav_standoff m from the object
#   (closer, MPPI's margin stops it short), then final_step walks at final_step_speed (m/s, at most
#   final_step_max m and final_step_s) to the trick's spot: sniff_distance m in front of the object, or for
#   pee the object pee_distance m beside the base and pee_back m behind its centre. final_step: false skips it.
#   frontiers: edges of /map between free and unknown, at least frontier_min_m long and frontier_clearance m from a
#   wall, the nearest frontiers_max of them.
#   arrive_tolerance: go_to / move ending farther than this from the goal (Nav2 stops at the nearest free spot
#   when the goal is in an obstacle) is reported as stopped short, not arrived.
#   objects: the object tools (list_objects, go_to_object, visit by id, look's boxes): true, false, or auto = offered
#   only while object_mapper publishes /objects ([I] with detection). Off, an on-board LLM is not sent after them;
#   visit then takes a map point (x, y) only.
mcp:
  host: 0.0.0.0
  objects: auto
  port: 8765
  camera: front
  image_width: 640
  goal_timeout: 120
  approach: 0.6
  visit_radius: 1.0
  max_move_m: 2.0
  arrive_tolerance: 0.3
  nav_standoff: 0.8
  sniff_distance: 0.5
  pee_distance: 0.4
  pee_back: 0.15
  final_step: true
  final_step_speed: 0.15
  final_step_max: 0.6
  final_step_s: 6.0
  frontier_min_m: 0.6
  frontier_clearance: 0.2
  frontiers_max: 8

# --- Motor Physical Parameters ---
motor:
  max_torque: 45.0        # Nm (Saturation torque for Go2)
  max_velocity: 30.0      # rad/s (Limit at zero torque)

# --- State Estimation ---
state_estimator:
  use_estimator: false    # Switch between perfect and estimated odom
  dt: 0.02                # Control loop dt (50Hz)
  # Contact gate, in raw FSR counts ABOVE each foot's own no-load reading - not
  # an absolute value. The four sensors sit at visibly different zeros, so one
  # absolute cut is a different gate on every foot: the highest-offset foot trips
  # early, the lowest may never trip. 10 counts is ~27 N (see fsr_scale), against
  # ~37 N per foot in an even stance.
  contact_threshold: 10.0

  # FSR zeroing on the real robot (deploy). At startup real_driver averages
  # fsr_calibration_time of readings per foot and uses those as the zeros, so the
  # threshold above means the same thing on all four. Keep the feet UNLOADED for
  # that window - a loaded foot would zero out its own load and then never
  # register contact. Guards against exactly that: a measured zero above
  # fsr_offset_max (a foot carrying weight reads ~bias+14) or noisier than
  # fsr_spread_max (a foot being moved) is rejected, and fsr_bias is kept for
  # that foot. The driver logs every measured zero, so tune these from the log.
  fsr_calibration_time: 1.0   # Seconds of samples at startup; 0 disables
  fsr_offset_max: 25.0        # Reject a zero above this (foot was loaded)
  fsr_spread_max: 3.0         # Reject a zero noisier than this (foot was moving)

  # Simulated FSR (MuJoCo only). MuJoCo's touch sensor gives clean newtons, which
  # hides the offset problem entirely. These map newtons back onto the robot's raw
  # scale (raw = bias + N / scale, plus noise) so the SAME contact_threshold above
  # is what the simulator applies. The simulated sensor is built from fsr_bias, so
  # in sim that value IS the calibration the robot has to measure.
  #   scale: with a 15.2 kg Go2, an even stance is 149/4 = 37 N per foot, which
  #   the robot reads as 30 raw -> 37 / (30 - 16) = 2.66 N per raw unit.
  fsr_bias: 16.0          # Raw reading with the foot unloaded
  fsr_scale: 2.66         # Newtons per raw FSR unit
  fsr_noise: 0.7          # Gaussian sigma in raw units (real spread is ~15-17)

  # Linear Kalman Filter (LKF) — 6-state: body velocity + accelerometer bias
  # Increase q_vel  → trust IMU more  (faster response, more noise)
  # Increase r_meas → trust FK less   (smoother, but slower correction)
  kalman:
    process_noise_vel:  0.01   # Q diagonal — velocity states  (m/s)²/step
    process_noise_bias: 0.001  # Q diagonal — accel bias states (m/s²)²/step
    measurement_noise:  0.05   # R diagonal — leg odometry measurement (m/s)²

# --- Terrain (MuJoCo driver) ---
terrain:
  amplitude: 0.08
  extent: 6.0
  resolution: 400
  smoothing: 1
  seed: 69
  foot_friction_slide: 0.8
  foot_friction_torsion: 0.02

# --- Simulated robot modifications (MuJoCo driver) ---
robot_mods:
  foot_mass: 0.01

# --- Safety Limits (Radians) ---
# Official Unitree Go2 Hardware Limits
joint_limits:
  abduction:
    min: -1.047
    max: 1.047
  hip_front:
    min: -1.571
    max: 3.491
  hip_rear:
    min: -0.524
    max: 4.538
  knee:
    min: -2.723
    max: -0.5    # Official is -0.838, set to -0.5 to allow straighter stance if desired

# --- Networking ---
network:
  robot_ip: "192.168.123.18"
  local_ip: "192.168.123.10"
  interface: "eth0"
  ros_domain_id: 42

  # ROS 2 discovery. The robot's WiFi AP drops multicast, so DDS discovery never
  # completes over wireless (ping is fine, `ros2 topic list` is empty). A FastDDS
  # discovery server on the robot replaces multicast with unicast client/server.
  # 10.42.0.1 is the AP's own address, fixed by NetworkManager shared mode, so it
  # is the same for every laptop that joins — nothing per-machine to edit.
  # Start it on the robot with:  fast-discovery-server -i 0 -l 10.42.0.1 -p 11811
  discovery_server: "10.42.0.1:11811"
  discovery_mode: "auto"     # auto = on only when this machine is on the AP's subnet
                             # on   = always use it | off = always plain multicast

# --- Policy core (robot only) ---
# real_driver gets one CPU core to itself at SCHED_FIFO; every launch and the launcher stay off it.
realtime:
  enabled: true
  core: -1                   # -1 = the last online CPU
  priority: 80               # SCHED_FIFO, 1-99

# --- Safety ---
safety:
  watchdog_timeout: 0.35     # Seconds before the policy is cut if no heartbeat
  # Gamepad e-stop. Any of these /joy button indices cuts the robot exactly as
  # Ctrl-C on the console does. Defaults are the F710 face buttons in X mode
  # (0=A 1=B 2=X 3=Y), which teleop_twist_joy leaves unused - the deadman is LB
  # and turbo is RB - so there is nothing to collide with. Empty list disables.
  estop_joy_buttons: [0, 1, 2, 3]
  emergency_kd: 5.0          # Damping applied on emergency stop (kp=0). Zero would
                             # leave the joints free and the robot would collapse;
                             # this makes it sink under control instead.
  emergency_kd_rear: 3.0     # Rear legs' damping on emergency stop. Lower than the front
                             # so the hips sink first and the robot sits back instead of
                             # landing on the lidar under its nose. In MuJoCo 3.0 put the
                             # rear down first at ~6 cm/s; 1.0 hit at up to 0.6 m/s.
  supervisor_frequency: 10.0 # Hz (Rate at which safety checks are performed)
  global_max_torque_percent: 55.0 # Maximum allowed torque as a percentage of physical motor capacity (45.0 Nm)
  base_tilt_limit_deg: 30   # Trigger emergency stop if base tilts past 30 degrees in any direction
  base_forward_tilt_limit_deg: 30.0    # Trigger emergency stop if pitched forward past 30 degrees
  joint_rom_safety_margin: 0.15        # Protect the outer 15% range of motion of each joint
  # The safety policy is policies.json's safety_policy. It takes over when a check trips, with no checks
  # of its own, until the robot lies still, then the robot goes numb. Empty = numb at once.
  safety_policy_timeout_s: 10.0  # Numb after this long even if it never counts as lying.
  lying_hold_s: 1.0          # Lying: within lying_tilt_deg of level, joints within lying_pose_err rad (mean)
  lying_tilt_deg: 20.0       # of poses.lie_flat and slower than lying_joint_vel rad/s, for this long.
  lying_pose_err: 0.3
  lying_joint_vel: 1.0

# --- Policies ---
# policies.json, next to this file: what the app and the console can switch to, by name (the launcher's
# checkpoint is "main"), and safety_policy. Only the active one and the safety one are loaded; the others
# load when picked and are freed when left. Per policy:
#   path:        relative to the repo. A launcher checkpoint at the same path takes that entry's settings.
#   protections: the checks that trip the safety switch while it runs. heartbeat (console alive), tilt (any
#                direction past base_tilt_limit_deg), pitch (nose down past base_forward_tilt_limit_deg),
#                rom (joints in the outer joint_rom_safety_margin). Left out = all four.
#   commands:    false feeds a zero velocity command, for policies trained without one. "trick" feeds the trick's
#                switches instead (IsaacLab_Tasks/Tricks): what keeps arriving on /pipeline/trick (skill_server),
#                [1, 0, 0] to do it (Pee: [0, 1, 0] for the right leg), zeros once it stops.
policy_switch_blend_s: 0.5   # Seconds to blend from the old policy's targets to the new one's.

# --- Pose Generator ---
poses:
  default_interp_duration: 3.0   # Seconds to interpolate between poses
  stand:    [0.1, -0.1, 0.1, -0.1, 0.8, 0.8, 1.0, 1.0, -1.5, -1.5, -1.5, -1.5]
  lie_flat: [0.45, -0.45, 0.65, -0.65, 1.25, 1.25, 1.25, 1.25, -2.6, -2.6, -2.6, -2.6]
  sit:      [0.1, -0.1, 0.1, -0.1, 1.2, 1.2, 2.0, 2.0, -2.0, -2.0, -2.5, -2.5]

# --- MCAP Logging & Telemetry Recording ---
logging:
  auto_record: true            # Automatically start background recording when launching simulation drivers
  record_dir: "Mcap/Recordings"      # Destination directory for recorded MCAP logs
  cluster_window_ms: 5              # Time window in ms to cluster messages into a single physical playback frame
